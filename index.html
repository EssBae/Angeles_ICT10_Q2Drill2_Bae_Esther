<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seatwork #2: Set Operators</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>
</head>
<style>
    body {
        font-family:Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        background-color: #c3d3e5bb;
        margin-top: 5rem;
        padding: 20px;
    }

    .container {
        max-width: 700px;
        background-color: #ffffff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    h1, h2 {
        text-align: center;
    }

    label {
        display: block;
        margin-top: 10px;
    }

    input[type="text"] {
        width: calc(100% - 22px);
        padding: 10px;
        margin-top: 5px;
        border-radius: 4px;
        border: 1px solid #ced4da;
    }

    button {
        display: block;
        width: 100%;
        padding: 10px;
        margin-top: 20px;
        border: none;
        border-radius: 4px;
    }

    button:hover {
        background-color: #0056b3;
    }

    #message {
        margin-top: 15px;
        text-align: center;
    }
</style>
<body>
    <div class="container">
        <h1> Add a new club member:</h1>

        <label for="first">First Name:</label>
        <input type="text" id="first" name="first"><br><br>

        <label for="last">Last Name:</label>
        <input type="text" id="last" name="last"><br><br>

        <button py-click="add_member" class="btn btn-primary">Add Member</button>
        <p id="message"></p>

        <br>
        <br>

        <h2>Club Members:</h2>
        <div id="output"></div>
        <script type="py" src="./main.py"></script>

    </div>

</body>
